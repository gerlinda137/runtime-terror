<div class="trending-market__header">
  <h2 appTypography="heading-3">Trending Market</h2>
  <a appTypography [routerLink]="marketsLink" class="trending-market__view-all"
    >View more markets</a
  >
</div>

<div class="trending-market__scroll">
  <table mat-table [dataSource]="rows()">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Token</th>
      <td mat-cell *matCellDef="let row" class="name-cell">
        <div class="token-cell">
          <img
            [appCryptoIcon]="row.symbol | symbol"
            [alt]="row.name"
            width="24"
            height="24"
            class="crypto-icon"
          />{{ row.name }}
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="symbol">
      <th mat-header-cell *matHeaderCellDef>Symbol</th>
      <td mat-cell *matCellDef="let row">{{ row.symbol | symbol }}</td>
    </ng-container>

    <ng-container matColumnDef="priceDisplay">
      <th mat-header-cell *matHeaderCellDef>Last Price</th>
      <td
        mat-cell
        *matCellDef="let row"
        [ngClass]="{ 'price-flash': flashingSymbols().has(row.symbol) }"
      >
        {{ row.priceDisplay }}
      </td>
    </ng-container>

    <ng-container matColumnDef="change24h">
      <th mat-header-cell *matHeaderCellDef>24H Change</th>
      <td mat-cell *matCellDef="let row">
        <span [appChangeColor]="row.change24h" class="semibold">
          {{ row.change24h >= 0 ? '↑' : '↓' }} {{ row.change24h | changeHour }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="volume">
      <th mat-header-cell *matHeaderCellDef>Volume</th>
      <td mat-cell *matCellDef="let row">{{ row.volume | formatVolume }}</td>
    </ng-container>

    <ng-container matColumnDef="favourite">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row" class="fav-cell">
        <button
          mat-icon-button
          (click)="onFavClick($event, row.symbol)"
          [attr.aria-label]="row.isFavourite ? 'Remove from watchlist' : 'Add to watchlist'"
        >
          <mat-icon [class.fav-active]="row.isFavourite">
            {{ row.isFavourite ? 'star' : 'star_border' }}
          </mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns; trackBy: trackBySymbol"></tr>
  </table>

  @if (rows().length === 0) {
    <div class="empty-state">
      <mat-icon>search_off</mat-icon>
      <span>No pairs found</span>
    </div>
  }
</div>
